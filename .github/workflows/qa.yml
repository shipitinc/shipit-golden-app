name: qa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The toolchain is pinned by FVM (.fvmrc -> 3.44.7 / Dart 3.12.2). Every
# package command runs through `melos`, which invokes `fvm flutter/dart`, so
# each job provisions FVM and the Serverpod CLI exactly as documented in
# AGENTS.md and docs/architecture/flutter-toolchain.md.
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Generate + drift check
        run: melos run generate:check
      - name: Analyze
        run: melos run analyze

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipit
          POSTGRES_PASSWORD: shipit
          POSTGRES_DB: shipit_golden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Generate + drift check
        run: melos run generate:check
      - name: Test
        run: melos run test
      - name: Test golden baselines (Linux-authoritative)
        run: melos run test:golden
      - name: Upload golden failure feedback (diagnostic)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/app/test/goldens/failures
          if-no-files-found: ignore

  # Build jobs prove the release artifacts compile for every defined flavor
  # (development/qa/production) with the pinned toolchain, in addition to the
  # analysis/generation/test gates above. Web builds on ubuntu; Android uses
  # JDK 17 + Android SDK (platform 36, build-tools 36, pinned NDK); iOS builds
  # without code signing on macOS. All run through the same Melos build:*
  # scripts in the workspace.
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Generate + drift check
        run: melos run generate:check
      - name: Build web release (development)
        run: melos run build:web:development
      - name: Build web release (qa)
        run: melos run build:web:qa
      - name: Build web release (production)
        run: melos run build:web:production

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK components (platform 36, build-tools 36, NDK)
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Generate + drift check
        run: melos run generate:check
      - name: Build release APK (development)
        run: melos run build:android:development
      - name: Build release APK (qa)
        run: melos run build:android:qa
      - name: Build release APK (production)
        run: melos run build:android:production

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Generate + drift check
        run: melos run generate:check
      - name: Build iOS without codesigning (development)
        run: melos run build:ios:development
      - name: Build iOS without codesigning (qa)
        run: melos run build:ios:qa
      - name: Build iOS without codesigning (production)
        run: melos run build:ios:production

  # Device/server-gated suites (integration_test/) are NOT part of the
  # default pipeline; see product.yaml and docs/qa/strategy.md.