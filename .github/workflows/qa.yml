name: qa

on:
  push:
    branches: [main]
  pull_request:

# The toolchain is pinned by FVM (.fvmrc -> 3.44.7 / Dart 3.12.2). Every
# package command runs through `melos`, which invokes `fvm flutter/dart`, so
# each job provisions FVM and the Serverpod CLI exactly as documented in
# AGENTS.md and docs/architecture/flutter-toolchain.md.
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Analyze
        run: melos run analyze

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Code generation is up to date
        run: melos run generate:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipit
          POSTGRES_PASSWORD: shipit
          POSTGRES_DB: shipit_golden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Generate
        run: melos run generate
      - name: Regenerate goldens on Linux (baseline alignment, diagnostic)
        working-directory: apps/app
        run: fvm flutter test test/goldens --update-goldens
      - name: Upload Linux-regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: linux-goldens
          path: apps/app/test/goldens/goldens
      - name: Test
        run: melos run test
      - name: Upload golden failure feedback (diagnostic)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/app/test/goldens/failures
          if-no-files-found: ignore

  # Device/server-gated suites (integration_test/, Patrol) are NOT part of the
  # default pipeline; see product.yaml and docs/qa/strategy.md.