name: goldens-update

# Regenerates golden baselines on the CI host (Linux) and pushes the fresh PNGs
# back to the branch. All current baselines are APPROVED, so this must only run
# when a design/human approval authorizes a visual change — the operator
# supplies the approved `design_revision` + `reviewer` and MUST also record the
# change in `goldens_registry.md` in the same commit.
#
# Baseline caveat: golden_toolkit parses PNGs under the engine's rasterizer,
# and text rasterization differs slightly between macOS (CoreText) and Linux
# (FreeType) even for the same TTF (~1% pixel diff). The authoritative golden
# host is therefore the Linux runner, and baselines MUST be regenerated here
# rather than on a dev macOS machine. Local macOS runs are expected to show a
# small known diff on exactly the golden tests.
#
# AEF/AGENTS.md: this is deliberately manual (`workflow_dispatch`) and requires
# the approved `design_revision` + `reviewer` inputs so it can never silently
# regenerate APPROVED baselines. The push performed by GITHUB_TOKEN does not
# re-trigger `push` workflows, so this can never loop.

on:
  workflow_dispatch:
    inputs:
      design_revision:
        description: >-
          Approved design revision this regeneration is authorized against
          (e.g. `shipit_ui@<sha>` or the Penpot revision). REQUIRED for
          APPROVED baselines; record it in goldens_registry.md too.
        required: true
        type: string
      reviewer:
        description: Person granting design/human approval for this regeneration.
        required: true
        type: string

jobs:
  regenerate-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Regenerate candidate golden baselines
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.design_revision }}" ]; then
            echo "::error::design_revision input is required; regeneration of" \
              "APPROVED baselines needs explicit design/human approval." >&2
            exit 1
          fi
          melos exec --scope="shipit_golden_app" -- \
            fvm flutter test test/goldens --update-goldens
      - name: Commit and push regenerated baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/test/goldens/goldens
          if git diff --cached --quiet; then
            echo "No golden baseline changes to commit."
          else
            git commit -m "test(goldens): regenerate baselines against approved revision ${{ inputs.design_revision }} (approved by ${{ inputs.reviewer }}; recorded in goldens_registry.md)"
            git push
          fi
