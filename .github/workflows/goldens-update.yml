name: goldens-update

# Regenerates golden baselines on the CI host (Linux), records the approval in
# `goldens_registry.md` + `docs/qa/pending-actions.md`, and pushes the whole
# change back to the branch — "updated golden + registry update in the same
# commit" per AEF/AGENTS.md, so one dispatch fully fixes golden CI. All current
# baselines are APPROVED, so this must only run when a design/human approval
# authorizes a visual change — the operator supplies the approved
# `design_revision` + `reviewer`, which the workflow writes into the registry.
#
# Baseline caveat: golden_toolkit parses PNGs under the engine's rasterizer,
# and text rasterization differs slightly between macOS (CoreText) and Linux
# (FreeType) even for the same TTF (~1% pixel diff). The authoritative golden
# host is therefore the Linux runner, and baselines MUST be regenerated here
# rather than on a dev macOS machine. Local macOS runs are expected to show a
# small known diff on exactly the golden tests.
#
# AEF/AGENTS.md: this is deliberately manual (`workflow_dispatch`) and requires
# the approved `design_revision` + `reviewer` inputs so it can never silently
# regenerate APPROVED baselines. The push performed by GITHUB_TOKEN does not
# re-trigger `push` workflows, so this can never loop.

on:
  workflow_dispatch:
    inputs:
      design_revision:
        description: >-
          Approved design revision this regeneration is authorized against
          (e.g. `shipit_ui@<sha>` or the Penpot revision). REQUIRED for
          APPROVED baselines; record it in goldens_registry.md too.
        required: true
        type: string
      reviewer:
        description: Person granting design/human approval for this regeneration.
        required: true
        type: string

jobs:
  regenerate-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Generate + drift check
        run: melos run generate:check
      - name: Regenerate candidate golden baselines
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.design_revision }}" ]; then
            echo "::error::design_revision input is required; regeneration of" \
              "APPROVED baselines needs explicit design/human approval." >&2
            exit 1
          fi
          melos exec --scope="shipit_golden_app" -- \
            fvm flutter test test/goldens --update-goldens
      - name: Record the re-approval in the registry and pending actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ inputs.design_revision }}" "${{ inputs.reviewer }}" <<'PY'
          import datetime
          import pathlib
          import sys

          design_revision = sys.argv[1]
          reviewer = sys.argv[2]
          today = datetime.date.today().isoformat()

          registry_path = pathlib.Path("apps/app/test/goldens/goldens_registry.md")
          lines = registry_path.read_text().splitlines(keepends=True)
          marker = f"[re-approved {today} for {design_revision} by {reviewer} via goldens-update.yml]"
          changed_registry = False
          for i, line in enumerate(lines):
              if not line.startswith("| `goldens/login_"):
                  continue
              cells = line.rstrip("\n").split("|")
              # cells: ['', ' `goldens/x.png` ', ' Screen ', ' APPROVED ',
              #         ' design revision ', ' notes ']
              if cells[4].strip() != design_revision:
                  cells[4] = f" {design_revision} "
                  changed_registry = True
              if marker not in cells[5]:
                  cells[5] = cells[5].rstrip() + " " + marker
                  changed_registry = True
              lines[i] = "|".join(cells) + "\n"
          if changed_registry:
              registry_path.write_text("".join(lines))

          pending_path = pathlib.Path("docs/qa/pending-actions.md")
          pending_lines = pending_path.read_text().splitlines(keepends=True)
          changed_pending = False
          for i, line in enumerate(pending_lines):
              if "UPSTREAM_UI_GAP-012" in line and "| pending " in line:
                  pending_lines[i] = line.replace(
                      line.split("|")[-2].strip(),
                      f"completed {today}",
                  )
                  changed_pending = True
          if changed_pending:
              pending_path.write_text("".join(pending_lines))
          PY
          git diff --stat
      - name: Commit and push regenerated baselines + approval record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/test/goldens/goldens \
            apps/app/test/goldens/goldens_registry.md \
            docs/qa/pending-actions.md
          if git diff --cached --quiet; then
            echo "No golden baseline changes to commit."
          else
            git commit -m "test(goldens): regenerate baselines against approved revision ${{ inputs.design_revision }} (approved by ${{ inputs.reviewer }}; recorded in goldens_registry.md)"
            git push
          fi
