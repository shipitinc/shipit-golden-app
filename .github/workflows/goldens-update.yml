name: goldens-update

# Regenerates the candidate DESIGN_PENDING golden baselines on the CI host
# (Linux) and pushes the fresh PNGs back to the branch.
#
# Baseline caveat: golden_toolkit parses PNGs under the engine's rasterizer,
# and text rasterization differs slightly between macOS (CoreText) and Linux
# (FreeType) even for the same TTF (~1% pixel diff). The authoritative golden
# host is therefore the Linux runner, and baselines MUST be regenerated here
# rather than on a dev macOS machine. Local macOS runs are expected to show a
# small known diff on exactly the golden tests.
#
# AEF/AGENTS.md: this is deliberately manual (`workflow_dispatch`). Approved
# (APPROVED) baselines must never be regenerated by this workflow; the
# candidate login baselines are DESIGN_PENDING and the regeneration is
# recorded in `apps/app/test/goldens/goldens_registry.md`. The push performed
# by GITHUB_TOKEN does not re-trigger `push` workflows, so this can never loop.

on:
  workflow_dispatch:

jobs:
  regenerate-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Activate FVM (pinned) and add to PATH
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter SDK via FVM (.fvmrc)
        run: fvm install
      - name: Add FVM Flutter SDK to PATH
        run: echo "$HOME/fvm/versions/3.44.7/bin" >> "$GITHUB_PATH"
      - name: Activate Serverpod CLI (pinned)
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Bootstrap
        run: |
          dart pub global activate melos 8.6.0
          melos bootstrap
      - name: Regenerate candidate golden baselines
        run: |
          melos exec --scope="shipit_golden_app" -- \
            fvm flutter test test/goldens --update-goldens
      - name: Commit and push regenerated baselines
        run: |
          set -euo pipefail
          if git diff --name-only -- apps/app/test/goldens/goldens | rg -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/app/test/goldens/goldens
            git commit -m "test(goldens): regenerate DESIGN_PENDING baselines on CI host (Linux runner, real bundled Inter; recorded in goldens_registry.md)"
            git push
          else
            echo "No golden baseline changes to commit."
          fi
