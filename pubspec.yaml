name: shipit_golden_app_workspace
description: ShipIt Golden App monorepo workspace
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  crypto: ^3.0.3
  melos: ^8.6.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

workspace:
  - apps/app
  - apps/server
  - packages/app_client

melos:
  scripts:
    format:
      description: Format all Dart code.
      exec: fvm dart format .

    analyze:
      description: Analyze all code.
      exec: fvm dart analyze .

    generate:
      description: Run all code generation (Serverpod, Freezed, JSON serialization).
      steps:
        - generate:server
        - generate:freezed

    generate:check:
      description: >-
        Drift detection. Runs the full generation pipeline, formats the output,
        verifies no tracked file changed, then compares a hash of the gitignored
        generated output against the committed `.generated_manifest.json`.
        A tracked-only diff cannot see field-level changes in models/endpoints
        (Freezed `.g.dart`, Serverpod client/server output are gitignored), so
        the manifest fingerprints the regenerated output; model drift fails CI
        until `melos run generate:manifest` is committed with the change.
      run: |
        melos run generate
        melos run format
        git diff --exit-code --quiet HEAD
        fvm dart run tool/update_generated_manifest.dart check

    generate:manifest:
      description: >-
        Regenerate the generated-output manifest after a *legitimate* model or
        endpoint change. Run the full generation pipeline, format, then snapshot
        the new generated output into `.generated_manifest.json` (commit it
        together with the model/endpoint change).
      run: |
        melos run generate
        melos run format
        fvm dart run tool/update_generated_manifest.dart

    generate:server:
      description: Serverpod generate only (server code + regenerated client package).
      run: cd apps/server && serverpod generate

    generate:client:
      description: Regenerate the Serverpod client package only.
      run: serverpod generate --directory apps/server

    generate:freezed:
      description: Freezed/JSON generation only.
      run: melos exec --scope="shipit_golden_app" -- fvm dart run build_runner build

    seed:
      description: Seed the database with reference data (idempotent).
      run: cd apps/server && fvm dart run bin/seed.dart

    test:
      description: Run all tests.
      steps:
        - test:unit
        - test:server
        - test:flutter

    test:unit:
      description: Dart unit tests (app_client package).
      run: melos exec --scope="app_client" -- fvm dart test

    test:server:
      description: Serverpod server tests.
      run: melos exec --scope="shipit_golden_server" -- fvm dart test

    test:flutter:
      description: >-
        Flutter app tests (golden pixel comparisons excluded — they run only
        via `test:golden` on the Linux CI host, the platform of record for
        approved baselines).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter test --exclude-tags golden

    test:golden:
      description: >-
        Golden baseline tests. Authoritative ONLY on the Linux CI host
        (approved baselines are gated there; macOS renders text ~1% differently
        so `melos run test:golden` on a dev machine is expected to diff).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter test test/goldens --tags golden

    test:integration:
      description: Flutter integration tests.
      run: melos exec --scope="shipit_golden_app" -- fvm flutter test integration_test/

    qa:
      description: >-
        Run default QA pipeline (analyze + tests). Device/server-gated suites
        (integration, Patrol) are opt-in; see docs/qa/strategy.md.
      steps:
        - analyze
        - test

    dev:
      description: Start server + Flutter web.
      run: melos run dev:server & melos run dev:app

    dev:server:
      description: Start Serverpod only (http://localhost:8080).
      run: cd apps/server && fvm dart run bin/main.dart

    dev:app:
      description: Start Flutter web only (development flavor, http://localhost:8081, API on 8080).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run -d web-server --web-port=8081 --dart-define=API_BASE_URL=http://localhost:8080 --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    dev:app:development:
      description: Start Flutter web only (development flavor, http://localhost:8081).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run -d web-server --web-port=8081 --dart-define=API_BASE_URL=http://localhost:8080 --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    dev:app:qa:
      description: Start Flutter web only (qa flavor, http://localhost:8081).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run -d web-server --web-port=8081 --dart-define=FLAVOR=qa --target=lib/app/bootstrap/app_bootstrap.dart

    dev:app:production:
      description: Start Flutter web only (production flavor, http://localhost:8081).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run -d web-server --web-port=8081 --dart-define=FLAVOR=production --target=lib/app/bootstrap/app_bootstrap.dart

    build:web:
      description: Flutter web release build (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build web --release --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    build:web:development:
      description: Flutter web release build (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build web --release --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    build:web:qa:
      description: Flutter web release build (qa flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build web --release --dart-define=FLAVOR=qa --target=lib/app/bootstrap/app_bootstrap.dart

    build:web:production:
      description: Flutter web release build (production flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build web --release --dart-define=FLAVOR=production --target=lib/app/bootstrap/app_bootstrap.dart

    run:android:
      description: Run the app on Android (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor development --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    run:android:development:
      description: Run the app on Android (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor development --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    run:android:qa:
      description: Run the app on Android (qa flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor qa --dart-define=FLAVOR=qa --target=lib/app/bootstrap/app_bootstrap.dart

    run:android:production:
      description: Run the app on Android (production flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor production --dart-define=FLAVOR=production --target=lib/app/bootstrap/app_bootstrap.dart

    run:ios:
      description: Run the app on iOS simulator (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor development --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    run:ios:development:
      description: Run the app on iOS simulator (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor development --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    run:ios:qa:
      description: Run the app on iOS simulator (qa flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor qa --dart-define=FLAVOR=qa --target=lib/app/bootstrap/app_bootstrap.dart

    run:ios:production:
      description: Run the app on iOS simulator (production flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter run --flavor production --dart-define=FLAVOR=production --target=lib/app/bootstrap/app_bootstrap.dart

    build:android:development:
      description: Release APK (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build apk --flavor development --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    build:android:qa:
      description: Release APK (qa flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build apk --flavor qa --dart-define=FLAVOR=qa --target=lib/app/bootstrap/app_bootstrap.dart

    build:android:production:
      description: Release APK (production flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build apk --flavor production --dart-define=FLAVOR=production --target=lib/app/bootstrap/app_bootstrap.dart

    build:ios:development:
      description: iOS build without codesigning (development flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build ios --no-codesign --flavor development --dart-define=FLAVOR=development --target=lib/app/bootstrap/app_bootstrap.dart

    build:ios:qa:
      description: iOS build without codesigning (qa flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build ios --no-codesign --flavor qa --dart-define=FLAVOR=qa --target=lib/app/bootstrap/app_bootstrap.dart

    build:ios:production:
      description: iOS build without codesigning (production flavor).
      run: melos exec --scope="shipit_golden_app" -- fvm flutter build ios --no-codesign --flavor production --dart-define=FLAVOR=production --target=lib/app/bootstrap/app_bootstrap.dart