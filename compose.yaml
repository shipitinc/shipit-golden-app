services:
  postgres:
    image: postgres:16-alpine
    container_name: shipit-golden-postgres
    environment:
      POSTGRES_USER: shipit
      POSTGRES_PASSWORD: shipit
      POSTGRES_DB: shipit_golden
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipit -d shipit_golden"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: