risk_rationale: >-
  Level 2 (Feature UX Change) per the approved brief and DESIGN_GOVERNANCE.md:
  a new authenticated "Create Program" user flow (new form screen, new
  navigation path, submit mutation with loading + settled-failure handling,
  new Programs-surface entry points) changes user behavior and requires
  Independent Design Review (Gate D3) + human design approval (Gate D4). Not
  Level 3: the flow nests inside the existing programs branch of the
  authenticated StatefulShellRoute — no change to the global navigation/IA
  (rail / bottom bar untouched). All composition uses existing shipit_ui
  components; the entry-point controls (app-bar icon action, empty-state CTA)
  are standard shipit_ui compositions the brief explicitly allows to be
  flagged Level 1, but the revision as a whole stays Level 2.
changelog:
  - "Revision 1: initial design revision — completes the approved brief's Design Exploration. None (first revision)."
  - "Revision 1 (re-submission): Addressed Gate D3 findings F1-F4. F1: create endpoint throws InvalidParametersException (framework class) -> plain 400 -> ServerpodClientBadRequest -> AppFailure.validation via existing translator (error_translator.dart:73-75); removed ProgramNotFoundException typed-exception instruction; zero new protocol models. F2: HouseholdService.getOrCreateFor gains {Transaction? transaction} (findByOwner mirror) so create-Program + auto-join run in ONE caller-owned transaction (§5-2, §D-7); PC-010 test verifies N concurrent creates for one owner -> exactly one household, one membership per program, N programs. F3: removed fabricated two-AppIconButton test claim (app-bar gains a third action; future action-counting tests must include it). F4: documented AppDatePicker ~20px date_picker_clear tap target as upstream shipit_ui accessibility gap -> UPSTREAM_UI_GAP/DCR, not fixed in-app; risk unchanged. Corrected app-bar line citations to programs_screen.dart:32-51. Status -> UNDER_REVIEW for Gate D3 re-review by independent-design-reviewer-dytajy."
