## Objective dark-mode verification (pixel sampling, not eye-check)

Every capture was pixel-sampled. All six render **genuinely dark** — ≥96% of
pixels at brightness < 60/255 (the light surfaces from the same day measure
~250/255 by the same sampler):

| Surface | avg brightness | frac dark (<60) | frac light (>200) |
|---|---|---|---|
| login | 14.8 | 0.981 | 0.001 |
| household | 20.4 | 0.984 | 0.003 |
| programs list | 24.0 | 0.964 | 0.007 |
| create form | 20.2 | 0.972 | 0.001 |
| details JOINED | 20.1 | 0.975 | 0.004 |
| failure alert | 16.8 | 0.975 | 0.003 |

Foreground readability: the light-on-dark foreground cluster is present on all
surfaces — near-white `(248,250,252)` and light-gray `(203,213,225)` text, the
primary blue accent `(96,165,250)`, and on the failure alert the semantic
red `(248,113,113)` error accent. No dark-on-dark text region, no light
background leak (no big-brightness cluster absent of foreground). The consumed
`shipitDarkTheme()` already satisfies WCAG AA body-text contrast
(`test/theme/dark_mode_test.dart`); the sweep confirms the *surfaces* consume
that theme consistently (no inverted/token-missing surface).

