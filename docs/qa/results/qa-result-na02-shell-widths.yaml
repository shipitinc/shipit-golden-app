## Shell-width breakpoints (shipit_ui)

Confirmed from `app/lib/app/shell/app_shell.dart`:
- `context.isTabletOrLarger` → `AppNavigationRail` (collapsed tablet, extended desktop)
- else → `AppBottomNavigationBar`
- shipit_ui `AppThemeTokens` breakpoints (`app_theme_tokens.dart:158-159`):
  - compact: <600 (bottom bar)
  - tablet: >=600 (collapsed rail)
  - desktop: >=1024 (extended rail)

