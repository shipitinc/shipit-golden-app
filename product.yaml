product:
  id: shipit-golden-app
  name: ShipIt Golden App

frontend:
  framework: flutter
  # Real minima are scaffolded for each target and buildable in CI
  # (analyze/generate-check/test/build jobs; see .github/workflows/qa.yml).
  targets:
    - web
    - android
    - ios

  # Environments (flavors) projected from the flavor standard. App names are
  # flavor-prefixed ([Dev]/[QA]) so the active environment is identifiable at
  # a glance; production carries a plain product name.
  flavors:
    development:
      android_application_id: io.letsshipit.golden
      ios_bundle_id: io.letsshipit.golden
      app_name: "[Dev] ShipIt Golden App"
    qa:
      android_application_id: io.letsshipit.golden.qa
      ios_bundle_id: io.letsshipit.golden.qa
      app_name: "[QA] ShipIt Golden App"
    production:
      android_application_id: io.letsshipit.golden.production
      ios_bundle_id: io.letsshipit.golden.production
      app_name: "ShipIt Golden App"

  toolchain:
    flutter_version_manager: fvm

  state_management:
    framework: bloc
    immutability: freezed

backend:
  framework: serverpod

database:
  postgres: true

design:
  system: shipit_ui
  source: penpot

  qa:
    unit: true
    widget: true
    golden: true
    accessibility: true
    integration: true
    patrol: false  # skeleton exists integration_test_patrol/; pending device/CI setup
    web: true
    android: true  # real Gradle project scaffolded with buildable per-flavor APKs
    ios: true  # real Xcode project + schemes scaffolded with buildable per-flavor builds

deployment:
  profile: standard