product:
  id: shipit-golden-app
  name: ShipIt Golden App

frontend:
  framework: flutter
  # Only `web` is scaffolded in this baseline. There are no real Android/iOS
  # projects (no Gradle build, no Xcode project); claiming them here would be
  # false. Add platforms deliberately in a later Phase.
  targets:
    - web

  toolchain:
    flutter_version_manager: fvm

  state_management:
    framework: bloc
    immutability: freezed

backend:
  framework: serverpod

database:
  postgres: true

design:
  system: shipit_ui
  source: penpot

  qa:
    unit: true
    widget: true
    golden: true
    accessibility: true
    integration: true
    patrol: false  # skeleton exists integration_test_patrol/; pending device/CI setup
    web: true
    android: false  # no Android project scaffolded; platform not buildable
    ios: false  # no iOS project scaffolded; platform not buildable

deployment:
  profile: standard