tags:
  integration:
    skip: false
# Each `withServerpod` group boots a Serverpod instance with its own PostgreSQL
# connection pool. Running test files in parallel stacks these pools and trips
# the postgres driver's pool-lock timeout (TimeoutException: Failed to acquire
# pool lock), so suites must run serially. Groups also bind ephemeral ports;
# see test/integration/test_tools/test_server_config.dart.
concurrency: 1