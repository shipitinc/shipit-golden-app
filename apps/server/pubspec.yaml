name: shipit_golden_server
description: ShipIt Golden App - Serverpod backend
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  serverpod: 3.4.13
  serverpod_auth_core_server: 3.4.13
  serverpod_auth_idp_server: 3.4.13

dev_dependencies:
  serverpod_test: 3.4.13
  test: ^1.25.0
  lints: ^6.1.0

executables:
  main: bin/main.dart

serverpod:
  scripts:
    # NB: deliberately NOT `--role maintenance` — the dev config sets
    # `applyMigrations: true`, which makes Serverpod 3.4.13 maintenance mode
    # exit after the (already-applied) migration step before the seed body
    # runs. The seed script calls `pod.shutdown()` itself instead.
    seed: dart bin/seed.dart