# Secrets for local development ONLY. Never use these values in production.
# Per-run-mode secret sections can be mirrored (e.g. `test`, `production`)
# and, in real deployments, overridden via SERVERPOD_PASSWORD_* env vars.
development:
  database: "shipit"
  jwtSecret: "development-secret-key-change-in-production"

  # Serverpod auth — email ID provider
  emailSecretHashPepper: "development-email-pepper-change-me"

  # Serverpod auth — JWT token manager
  jwtRefreshTokenHashPepper: "development-refresh-pepper-0123456789"
  jwtHmacSha512PrivateKey: "development-hmac-sha512-secret-key-0123456789"

test:
  database: "shipit"
  jwtSecret: "test-secret-key-not-used-in-production"

  emailSecretHashPepper: "test-email-pepper-change-me"
  jwtRefreshTokenHashPepper: "test-refresh-pepper-0123456789"
  jwtHmacSha512PrivateKey: "test-hmac-sha512-secret-key-0123456789"

# Production secrets are NEVER committed. The placeholder values below must be
# replaced at deploy time via SERVERPOD_PASSWORD_* env vars (Serverpod maps a
# `production.<key>` entry onto SERVERPOD_PASSWORD_<KEY> when set). Do not copy
# development/test values here; a committed secret defeats the point.
production:
  database: "REPLACE_ME"
  jwtSecret: "REPLACE_ME"
  emailSecretHashPepper: "REPLACE_ME"
  jwtRefreshTokenHashPepper: "REPLACE_ME"
  jwtHmacSha512PrivateKey: "REPLACE_ME"